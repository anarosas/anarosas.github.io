---
layout: default
---
<article class="terminal-file">
  <p class="section-label">$ cat {{ page.date | date: "%Y-%m-%d" }}-{{ page.slug }}.md</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    {{ page.date | date: "%B %d, %Y" }}{% if page.tags and page.tags.size > 0 %} // {{ page.tags | join: ", " }}{% endif %}
  </p>
  <div class="post-content">
    {{ content }}
  </div>
  <a class="see-all" href="{{ '/blog/' | relative_url }}">&larr; cd ../blog/</a>
</article>
